dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.

  flutter_lints: ^6.0.0
  custom_lint: ^0.7.6
  riverpod_lint: ^2.6.1

  riverpod_generator: ^2.6.1
  build_runner: ^2.5.4
  freezed: ^3.1.0


#  json_serializable: ^6.10.0
  flutter_native_splash: ^2.4.6
  flutter_launcher_icons: ^0.14.4

#  Tests
  fake_cloud_firestore: ^4.0.0  # For Firestore mocks
  firebase_auth_mocks: ^0.15.0  # For Auth mocks
  fake_async: ^1.3.3

flutter_icons:
  android: true
  ios: true
  image_path: assets/nightowl/logo.png
  adaptive_icon_background: "#000000"
#  adaptive_icon_foreground: "assets/nightowl/slogan.png"

flutter_native_splash:
  color: "#000000"
  image: assets/nightowl/logo.png

