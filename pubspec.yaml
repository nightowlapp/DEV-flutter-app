  path_provider: ^2.1.5
  hive: ^2.2.3

  cached_network_image: ^3.4.1
  image_picker: ^1.2.0
  flutter_image_compress: ^2.4.0 # WebP images

  animated_list_plus: ^0.5.2
  pdfx: ^2.9.2
  flutter_cache_manager: ^3.4.1
  share_plus: ^12.0.0

  permission_handler: ^12.0.1
  flutter_local_notifications: ^19.4.2

  flutter_tts: ^4.2.3
