dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.

  flutter_lints: ^6.0.0
  custom_lint: ^0.7.6
  riverpod_lint: ^2.6.1

  riverpod_generator: ^2.6.1
  build_runner: ^2.5.4
  freezed: ^3.1.0


#  json_serializable: ^6.10.0
#  flutter_native_splash: ^2.4.6
  flutter_launcher_icons: ^0.14.4

#  Tests
  fake_cloud_firestore: ^4.0.0  # For Firestore mocks
  firebase_auth_mocks: ^0.15.1  # For Auth mocks
  mocktail: ^1.0.4

  fake_async: ^1.3.3

# --- Launcher icons (Android & iOS) ---
flutter_launcher_icons:
  android: true
  ios: true

  # Base icons (required by the tool)
  # Android (pre-Oreo) uses this flat square PNG. You can temporarily reuse fg.png if needed.
  image_path_android: assets/nightowl/logos/Colored_Background_V2_2Line.png
#  image_path_android: assets/nightowl/logos/Colored_V2_Logo.png

  # iOS needs a 1024×1024 OPAQUE PNG (no transparency). iOS will round it automatically.
  image_path_ios: assets/nightowl/logos/Colored_Background_V2_2Line.png
#  image_path_ios: assets/nightowl/logos/Colored_V2_Logo.png
  remove_alpha_ios: true

  # Adaptive icons (Android 8+) → gives you rounded/squircle shapes per launcher
  adaptive_icon_foreground: assets/nightowl/logos/Colored_Background_V2_2Line.png  # 432×432 transparent glyph with padding
#  adaptive_icon_foreground: assets/nightowl/logos/Colored_V2_Logo.png
  adaptive_icon_background: "#000000"                # or assets/app_icon/bg.png (1080×1080)
#  adaptive_icon_monochrome: assets/nightowl/logos/NO_color.png # optional, pure white glyph for Android 13 themed icon

flutter_native_splash:
  color: "#000000"
  color_dark: "#000000"
  android_12:
    color: "#000000"
    color_dark: "#000000"

#dependency_overrides:

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/
    - assets/flags/
    - assets/fonts/
    - assets/nightowl/
    - assets/nightowl/cities/
    - assets/nightowl/logos/
    - assets/nightowl/flame.png

    - assets/fonts/MADE Tommy Soft Light PERSONAL USE.otf
    - assets/fonts/Quicksand-Regular.ttf


  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font.

  fonts:
    - family: TommySoft
      fonts:
       - asset: assets/fonts/MADE Tommy Soft Regular PERSONAL USE.otf
       - asset: assets/fonts/Quicksand-Regular.ttf
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
